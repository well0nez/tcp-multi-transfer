name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release)
        # Warnungsfrei ist der Stand, in dem das Repo ist — und der Zustand,
        # in dem es bleiben soll. Eine neue Warnung ist billiger zu beheben,
        # wenn sie sofort auffaellt.
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release

      - name: Prepare dist (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/tcp-multi-transfer dist/
          cp run_server.py dist/
          cp README.md dist/

      - name: Prepare dist (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\tcp-multi-transfer.exe dist\
          Copy-Item run_server.py dist\
          Copy-Item README.md dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcp-multi-transfer-${{ runner.os }}
          path: dist

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-cargo-

      # Analysator (mit den aufgezeichneten Fixtures) und die Koordination im
      # Relay, die gegen einen echten Server auf 127.0.0.1 gefahren wird.
      - name: Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Build (release)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release

      # Echte Transfers ueber Loopback: ein, zwei und vier Stroeme, ungleiches
      # --chunk auf beiden Seiten, kleine Datei ueber viele Stroeme, winziges
      # Grace-Fenster, abgelehnte Doppelregistrierung, Streckenmessung.
      # Prueft das Zusammenspiel von Client und Relay, das kein Unit-Test
      # erreicht.
      - name: Loopback regression
        run: ./regression.sh
